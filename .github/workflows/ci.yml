name: CI

on:
  push:
    branches: [main, 'noah/**']
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.9', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install reviewed checkout and development tools
        run: python -m pip install -e '.[dev]'
      - name: Lint and format
        run: |
          python -m ruff check skillvet tests scripts _build_backend.py
          python -m ruff format --check skillvet tests scripts _build_backend.py
      - name: Test complete package with coverage gate
        run: python -m pytest --cov=skillvet --cov-report=xml --cov-fail-under=70
      - name: Build source and wheel distributions
        run: python -m build
      - name: Check exact expected detection exit codes
        shell: bash
        run: |
          python -m skillvet examples/clean-skill --strict --json > clean.json
          set +e
          python -m skillvet examples/malicious-skill --json > malicious.json
          json_status=$?
          python -m skillvet examples/malicious-skill --sarif > malicious.sarif
          sarif_status=$?
          set -e
          test "$json_status" -eq 1
          test "$sarif_status" -eq 1
          python -c "import json; d=json.load(open('malicious.json')); assert d['complete'] and d['findings']"
          python -c "import json; d=json.load(open('malicious.sarif')); assert d['version']=='2.1.0' and d['runs'][0]['invocations'][0]['executionSuccessful']"
      - name: Install wheel and run outside source tree
        shell: bash
        run: |
          python -m venv wheel-smoke
          wheel-smoke/bin/python -m pip install dist/*.whl
          interpreter="$PWD/wheel-smoke/bin/python"
          cd "$(mktemp -d)"
          "$interpreter" -m skillvet --version
