[build-system]
requires = ["setuptools>=68"]
build-backend = "_build_backend"
backend-path = ["."]

[project]
name = "skillvet"
version = "1.0.0"
description = "Security audit for AI agent skills, hooks and MCP configs"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "skillvet contributors" }]
keywords = ["ai-agents", "claude-code", "mcp", "security", "lint", "prompt-injection", "supply-chain"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.scripts]
skillvet = "skillvet.cli:main"

[tool.setuptools.packages.find]
include = ["skillvet*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov>=4", "ruff>=0.9", "build>=1", "setuptools>=68", "wheel>=0.42"]
assets = ["pillow>=10"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.coverage.run]
source = ["skillvet"]

[tool.coverage.report]
fail_under = 70
show_missing = true
